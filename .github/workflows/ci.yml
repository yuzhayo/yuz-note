name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Velopack
        shell: pwsh
        run: ./tools/Restore-Dependencies.ps1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B release/build `
            -G 'Visual Studio 18 2026' -A x64 `
            -DCMAKE_PREFIX_PATH="development/Qt/6.8.3/msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build release/build --config Release

      - name: Corpus test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/run-corpus.ps1

      - name: Viewer smoke test
        shell: pwsh
        run: |
          $env:PATH = "development/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          & release\build\tests\viewer-smoke\Release\viewer-smoke.exe tests\corpus
